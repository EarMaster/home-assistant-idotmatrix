# Names and descriptions live in strings.json / translations/*.json ("services").

show_icon_message:
  target:
    device:
      integration: idotmatrix
    entity:
      integration: idotmatrix
  fields:
    icon:
      required: true
      example: mdi:bell
      selector:
        icon:
    text:
      required: true
      example: "{{ states('sensor.outside_temperature') }}°C"
      selector:
        text:
    text_color:
      example: [255, 165, 0]
      selector:
        color_rgb:
    icon_color:
      example: [255, 0, 0]
      selector:
        color_rgb:
    restore_after:
      example: "00:00:30"
      selector:
        duration:

show_text:
  target:
    device:
      integration: idotmatrix
    entity:
      integration: idotmatrix
  fields:
    text:
      required: true
      example: "Dinner is ready"
      selector:
        text:
    color:
      example: [0, 255, 255]
      selector:
        color_rgb:
    font_size:
      example: 24
      selector:
        number:
          min: 8
          max: 32
          step: 1
          unit_of_measurement: px
          mode: slider
    speed:
      example: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: slider
    restore_after:
      example: "00:00:30"
      selector:
        duration:

start_countdown:
  target:
    device:
      integration: idotmatrix
    entity:
      integration: idotmatrix
  fields:
    duration:
      required: true
      example: "00:05:30"
      selector:
        duration:
    restore_after:
      example: "00:00:10"
      selector:
        duration:

set_scoreboard:
  target:
    device:
      integration: idotmatrix
    entity:
      integration: idotmatrix
  fields:
    home:
      example: 2
      selector:
        number:
          min: 0
          max: 999
          mode: box
    away:
      example: 1
      selector:
        number:
          min: 0
          max: 999
          mode: box
