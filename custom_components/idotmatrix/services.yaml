show_icon_message:
  name: Show Icon & Message
  description: >-
    Show an icon in the top portion of the display with text below. Text that fits
    is shown still; longer text scrolls back and forth. Also updates the
    Icon & Message entities.
  fields:
    device_id:
      name: Display
      description: The iDotMatrix display(s) to show the message on
      required: true
      selector:
        device:
          integration: idotmatrix
          multiple: true
    icon:
      name: Icon
      description: >-
        An MDI icon (e.g. mdi:bell). In YAML mode this can also be a local file
        path (/config/www/icons/home.png) or an http(s) image URL.
      required: true
      example: mdi:bell
      selector:
        icon:
    text:
      name: Text
      description: Text shown below the icon. Supports templates.
      required: true
      example: "{{ states('sensor.outside_temperature') }}°C"
      selector:
        text:
    text_color:
      name: Text color
      description: >-
        Any color from the color picker. In YAML, also [r, g, b] or a preset name
        (red, green, blue, yellow, cyan, magenta, white, orange, purple, pink).
        Leave empty to keep the current Icon & Message text color.
      example: [255, 165, 0]
      selector:
        color_rgb:
    icon_color:
      name: Icon color
      description: >-
        Icon color (MDI icons only). Any color from the color picker; in YAML also
        [r, g, b] or a preset name. Leave empty to keep the current Icon & Message
        icon color.
      example: [255, 0, 0]
      selector:
        color_rgb:

display_text:
  name: Display Text
  description: Display a text message on the iDotMatrix display
  fields:
    message:
      name: Message
      description: Text message to display
      required: true
      selector:
        text:
    font_size:
      name: Font Size
      description: Size of the font
      default: medium
      selector:
        select:
          options:
            - small
            - medium
            - large
    color:
      name: Color
      description: Text color (name or RGB values)
      default: white
      selector:
        select:
          options:
            - red
            - green
            - blue
            - yellow
            - cyan
            - magenta
            - white
            - orange
            - purple
            - pink
    speed:
      name: Speed
      description: Animation speed (1-100)
      default: 50
      selector:
        number:
          min: 1
          max: 100

display_image:
  name: Display Image
  description: Display an image or GIF on the iDotMatrix display
  fields:
    image_path:
      name: Image Path
      description: Path to the image file
      required: true
      selector:
        text:
    duration:
      name: Duration
      description: How long to display the image (seconds)
      default: 5
      selector:
        number:
          min: 1
          max: 60

set_clock_mode:
  name: Set Clock Mode
  description: Set the clock display style
  fields:
    clock_style:
      name: Clock Style
      description: Style of the clock display
      required: true
      selector:
        select:
          options:
            - classic
            - digital
            - analog
            - minimal
            - colorful

display_effect:
  name: Display Effect
  description: Display a visual effect on the iDotMatrix display
  fields:
    effect_type:
      name: Effect Type
      description: Type of visual effect
      required: true
      selector:
        select:
          options:
            - rainbow
            - random_pixels
            - white
            - rainbow_vertical
            - diagonal_right
            - diagonal_left
            - random

sync_time:
  name: Sync Time
  description: Synchronize the device time with Home Assistant
